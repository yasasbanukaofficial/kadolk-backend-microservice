server:
  port: 8761

eureka:
  client:
    # Server should not register itself as a service - It doesn't need to call itself
    register-with-eureka: false

    # Prevents fetching its own service list
    # Eureka server doesn't need the registry as it contains the registry
    # No need to download its own registry
    # Only other services need to download the registry as those services need to know where other registry runs
    fetch-registry: false